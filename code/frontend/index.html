<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProofLayer — AI Compliance Engine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.1/Recharts.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    body { background: #0B1120; }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .gradient-text { background: linear-gradient(135deg, #38BDF8, #818CF8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .score-ring { stroke-dasharray: 251.2; transition: stroke-dashoffset 1.2s ease; }
    .drop-zone { border: 2px dashed rgba(56,189,248,0.3); transition: all 0.2s; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #38BDF8; background: rgba(56,189,248,0.05); }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
    .gap-badge { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); }
    .good-badge { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); }
    .partial-badge { background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.3); }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0B1120; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 3px; }
    textarea { background: #0F172A; color: #94A3B8; border: 1px solid #1E293B; border-radius: 8px; width: 100%; padding: 12px; font-size: 13px; font-family: monospace; resize: vertical; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback, useEffect, useRef } = React;
const API = "http://localhost:8000";

// ── Utility ──────────────────────────────────────────────────────────────────
const riskColor = (r) => ({ HIGH: "#EF4444", MEDIUM: "#F59E0B", LOW: "#22C55E" }[r] || "#6B7280");
const scoreColor = (s) => s >= 80 ? "#22C55E" : s >= 55 ? "#F59E0B" : "#EF4444";
const fmt = (n) => n !== undefined ? `$${n.toFixed(4)}` : "-";

// ── Score Ring ────────────────────────────────────────────────────────────────
function ScoreRing({ score }) {
  const r = 40, circ = 2 * Math.PI * r;
  const offset = circ - (score / 100) * circ;
  const color = scoreColor(score);
  return (
    <div className="flex flex-col items-center">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r={r} fill="none" stroke="#1E293B" strokeWidth="10"/>
        <circle cx="50" cy="50" r={r} fill="none" stroke={color} strokeWidth="10"
          strokeLinecap="round" strokeDasharray={circ}
          strokeDashoffset={offset} style={{transition:"stroke-dashoffset 1s",transform:"rotate(-90deg)",transformOrigin:"center"}}/>
        <text x="50" y="55" textAnchor="middle" fill={color} fontSize="20" fontWeight="bold">{score}%</text>
      </svg>
    </div>
  );
}

// ── Framework Bar ─────────────────────────────────────────────────────────────
function FwBar({ name, score }) {
  const color = scoreColor(score);
  return (
    <div className="mb-3">
      <div className="flex justify-between text-xs mb-1">
        <span className="text-slate-300">{name}</span>
        <span style={{color}}>{score}%</span>
      </div>
      <div className="h-1.5 rounded-full" style={{background:"#1E293B"}}>
        <div className="h-full rounded-full" style={{width:`${score}%`, background:color, transition:"width 1s"}}/>
      </div>
    </div>
  );
}

// ── Gap Card ──────────────────────────────────────────────────────────────────
function GapCard({ gap, onFix }) {
  const [fixing, setFixing] = useState(false);
  const [policy, setPolicy] = useState(null);

  const handleFix = async () => {
    setFixing(true);
    try {
      const r = await fetch(`${API}/fix`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ control_id: gap.id, control_name: gap.control, framework: Object.keys(gap.frameworks)[0] })
      });
      const d = await r.json();
      setPolicy(d.policy_text);
      onFix && onFix();
    } catch(e) { alert("Fix generation failed. Check API key."); }
    finally { setFixing(false); }
  };

  return (
    <div className="glass rounded-xl p-4 fade-in">
      <div className="flex items-start justify-between mb-2">
        <div>
          <span className="text-slate-100 font-medium text-sm">{gap.control}</span>
          <div className="text-xs text-slate-500 mt-0.5">{gap.category} · {gap.id}</div>
        </div>
        <span className="text-xs font-bold px-2 py-0.5 rounded-full flex-shrink-0 ml-2"
          style={{background:`${riskColor(gap.risk)}20`, color:riskColor(gap.risk), border:`1px solid ${riskColor(gap.risk)}40`}}>
          {gap.risk} RISK
        </span>
      </div>
      <div className="flex flex-wrap gap-1 mb-2">
        {Object.keys(gap.frameworks).map(fw => (
          <span key={fw} className="text-xs px-2 py-0.5 rounded bg-blue-900/30 text-blue-300 border border-blue-800/40">{fw}</span>
        ))}
      </div>
      <p className="text-xs text-slate-400 mb-3">{gap.remediation}</p>
      {gap.ai_note && <p className="text-xs text-yellow-400/80 italic mb-3">AI: {gap.ai_note}</p>}
      {!policy && (
        <button onClick={handleFix} disabled={fixing}
          className="text-xs px-3 py-1.5 rounded-lg font-medium transition"
          style={{background:"rgba(56,189,248,0.1)",color:"#38BDF8",border:"1px solid rgba(56,189,248,0.3)"}}>
          {fixing ? "Generating policy..." : "Fix with AI →"}
        </button>
      )}
      {policy && (
        <div className="mt-3">
          <div className="text-xs text-green-400 font-medium mb-1">Policy Generated</div>
          <textarea value={policy} readOnly rows={6}/>
          <div className="text-xs text-slate-500 mt-1">Copy and add to your compliance documentation.</div>
        </div>
      )}
    </div>
  );
}

// ── Cost Dashboard ────────────────────────────────────────────────────────────
function CostDashboard() {
  const [costs, setCosts] = useState(null);
  useEffect(() => {
    fetch(`${API}/costs`).then(r=>r.json()).then(setCosts).catch(()=>{});
  }, []);

  if (!costs || !costs.calls?.length) return null;

  return (
    <div className="glass rounded-2xl p-5 mt-4 fade-in">
      <h3 className="text-slate-200 font-semibold mb-3 text-sm">Multi-LLM Cost Dashboard</h3>
      <div className="grid grid-cols-3 gap-3 mb-4">
        <div className="bg-slate-900/60 rounded-xl p-3 text-center">
          <div className="text-green-400 text-lg font-bold">{fmt(costs.total_cost_usd)}</div>
          <div className="text-slate-500 text-xs">Total Cost</div>
        </div>
        <div className="bg-slate-900/60 rounded-xl p-3 text-center">
          <div className="text-red-400 text-lg font-bold">{fmt(costs.single_model_cost)}</div>
          <div className="text-slate-500 text-xs">Single-Model Cost</div>
        </div>
        <div className="bg-slate-900/60 rounded-xl p-3 text-center">
          <div className="text-blue-400 text-lg font-bold">{costs.savings_pct}%</div>
          <div className="text-slate-500 text-xs">Cost Savings</div>
        </div>
      </div>
      <div className="space-y-2">
        {costs.calls.map((c, i) => (
          <div key={i} className="flex items-center justify-between text-xs py-1 border-b border-slate-800/50">
            <span className="text-slate-400">{c.task}</span>
            <span className="text-blue-300">{c.model}</span>
            <span className="text-green-400">{fmt(c.cost_usd)}</span>
            <span className="text-slate-500">{c.latency_ms}ms</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [view, setView]         = useState("upload"); // upload | auditing | results
  const [docId, setDocId]       = useState(null);
  const [filename, setFilename] = useState("");
  const [audit, setAudit]       = useState(null);
  const [report, setReport]     = useState(null);
  const [loading, setLoading]   = useState(false);
  const [loadMsg, setLoadMsg]   = useState("");
  const [drag, setDrag]         = useState(false);
  const [fwFilter, setFwFilter] = useState("ALL");
  const [tab, setTab]           = useState("gaps"); // gaps | verified | report
  const [apiHealth, setApiHealth] = useState(null);
  const fileRef = useRef();

  // Check API health on mount
  useEffect(() => {
    fetch(`${API}/health`).then(r=>r.json()).then(setApiHealth).catch(()=>setApiHealth({error:true}));
  }, []);

  const handleFile = async (file) => {
    if (!file) return;
    setLoading(true); setLoadMsg("Uploading document...");
    try {
      const fd = new FormData(); fd.append("file", file);
      const r = await fetch(`${API}/upload`, { method: "POST", body: fd });
      if (!r.ok) throw new Error(await r.text());
      const d = await r.json();
      setDocId(d.doc_id); setFilename(d.filename);
      setLoadMsg("Running compliance audit (AI gap analysis)...");
      const ar = await fetch(`${API}/audit`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ doc_id: d.doc_id, frameworks: ["FedRAMP","CMMC","NIST_800_53","SOC2"] })
      });
      if (!ar.ok) throw new Error(await ar.text());
      const ad = await ar.json();
      setAudit(ad); setView("results");
    } catch(e) {
      alert(`Error: ${e.message}\n\nMake sure the backend is running (python main.py) and API keys are set in .env`);
    }
    setLoading(false); setLoadMsg("");
  };

  const handleDrop = useCallback((e) => {
    e.preventDefault(); setDrag(false);
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  }, []);

  const generateReport = async () => {
    if (!audit) return;
    setLoadMsg("Generating executive report...");
    setLoading(true);
    try {
      const r = await fetch(`${API}/report/${audit.audit_id}`, { method: "POST" });
      const d = await r.json();
      setReport(d.report); setTab("report");
    } catch(e) { alert("Report generation failed."); }
    setLoading(false); setLoadMsg("");
  };

  const exportPDF = () => {
    window.open(`${API}/export/${audit.audit_id}`, "_blank");
  };

  const filteredGaps = audit ? (
    fwFilter === "ALL" ? audit.gaps : audit.gaps.filter(g => fwFilter in g.frameworks)
  ) : [];

  const filteredVerified = audit ? (
    fwFilter === "ALL" ? audit.verified_controls : audit.verified_controls.filter(v => true)
  ) : [];

  // Upload view
  if (view === "upload") return (
    <div className="min-h-screen flex flex-col items-center justify-center p-6">
      <div className="w-full max-w-2xl">
        {/* Logo */}
        <div className="text-center mb-10">
          <div className="inline-flex items-center gap-2 mb-4">
            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center">
              <span className="text-white text-sm font-bold">PL</span>
            </div>
            <span className="text-white text-2xl font-bold">ProofLayer</span>
          </div>
          <h1 className="text-4xl font-extrabold text-white mb-3">
            Compliance Audits in <span className="gradient-text">Minutes</span>
          </h1>
          <p className="text-slate-400 text-lg">
            AI-powered FedRAMP, CMMC, and NIST auditing for federal contractors
          </p>
          <div className="flex items-center justify-center gap-4 mt-4">
            {["FedRAMP", "CMMC 2.0", "NIST 800-53", "SOC2"].map(f => (
              <span key={f} className="text-xs px-2 py-1 rounded-full bg-blue-900/30 text-blue-300 border border-blue-800/40">{f}</span>
            ))}
          </div>
        </div>

        {/* API Status */}
        {apiHealth && (
          <div className={`text-center text-xs mb-4 px-3 py-2 rounded-lg ${apiHealth.error ? 'bg-red-900/30 text-red-400' : 'bg-green-900/30 text-green-400'}`}>
            {apiHealth.error
              ? "Backend not running. Start with: python backend/main.py"
              : `Backend connected · PDF: ${apiHealth.pdf_support ? "yes" : "no"} · PDF Export: ${apiHealth.report_export ? "yes" : "no"}`}
          </div>
        )}

        {/* Drop Zone */}
        <div
          className={`drop-zone rounded-2xl p-12 text-center cursor-pointer ${drag ? "drag-over" : ""}`}
          onClick={() => fileRef.current?.click()}
          onDrop={handleDrop}
          onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
        >
          {loading ? (
            <div>
              <div className="text-4xl mb-4 pulse">⚙️</div>
              <p className="text-blue-300 font-medium">{loadMsg}</p>
              <p className="text-slate-500 text-sm mt-2">Using multi-LLM pipeline...</p>
            </div>
          ) : (
            <div>
              <div className="text-5xl mb-4">📄</div>
              <p className="text-slate-200 font-semibold text-lg mb-2">Drop your policy document here</p>
              <p className="text-slate-500 text-sm">PDF or TXT · Security policies, SSPs, procedures, configs</p>
              <div className="mt-6 inline-block px-6 py-2.5 rounded-xl text-sm font-semibold"
                style={{background:"linear-gradient(135deg,#2563EB,#4F46E5)",color:"white"}}>
                Choose File
              </div>
            </div>
          )}
          <input ref={fileRef} type="file" accept=".pdf,.txt,.md,.doc" className="hidden"
            onChange={e => handleFile(e.target.files[0])}/>
        </div>

        {/* Before / After */}
        <div className="grid grid-cols-2 gap-4 mt-6">
          <div className="glass rounded-xl p-4 text-center">
            <div className="text-red-400 text-sm font-semibold mb-1">Before ProofLayer</div>
            <div className="text-slate-400 text-xs space-y-1">
              <div>Weeks of consulting</div>
              <div>$50K–$500K cost</div>
              <div>Manual spreadsheets</div>
            </div>
          </div>
          <div className="glass rounded-xl p-4 text-center">
            <div className="text-green-400 text-sm font-semibold mb-1">After ProofLayer</div>
            <div className="text-slate-400 text-xs space-y-1">
              <div>Minutes, not months</div>
              <div>80% lower cost</div>
              <div>Audit-ready reports</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );

  // Results view
  if (view === "results" && audit) return (
    <div className="min-h-screen p-6">
      <div className="max-w-6xl mx-auto">
        {/* Header */}
        <div className="flex items-center justify-between mb-6">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center">
              <span className="text-white text-sm font-bold">PL</span>
            </div>
            <div>
              <span className="text-white font-bold text-lg">ProofLayer</span>
              <div className="text-slate-500 text-xs">{filename}</div>
            </div>
          </div>
          <div className="flex gap-2">
            <button onClick={generateReport} disabled={loading}
              className="text-sm px-4 py-2 rounded-xl font-medium transition"
              style={{background:"rgba(99,102,241,0.2)",color:"#818CF8",border:"1px solid rgba(99,102,241,0.3)"}}>
              {loading && loadMsg.includes("report") ? "Generating..." : "Generate Report"}
            </button>
            {report && (
              <button onClick={exportPDF}
                className="text-sm px-4 py-2 rounded-xl font-medium"
                style={{background:"linear-gradient(135deg,#059669,#0D9488)",color:"white"}}>
                Export PDF
              </button>
            )}
            <button onClick={() => { setView("upload"); setAudit(null); setReport(null); }}
              className="text-sm px-4 py-2 rounded-xl font-medium glass text-slate-300">
              New Audit
            </button>
          </div>
        </div>

        {/* Top row: Score + Framework grid */}
        <div className="grid grid-cols-4 gap-4 mb-6">
          {/* Score card */}
          <div className="glass rounded-2xl p-5 col-span-1 flex flex-col items-center justify-center fade-in">
            <div className="text-slate-400 text-xs font-medium mb-3 uppercase tracking-wide">Compliance Score</div>
            <ScoreRing score={audit.overall_score}/>
            <div className="mt-3 text-center">
              <span className="text-sm font-bold px-3 py-1 rounded-full"
                style={{background:`${riskColor(audit.risk_level)}20`, color:riskColor(audit.risk_level)}}>
                {audit.risk_level} RISK
              </span>
            </div>
            <div className="mt-3 grid grid-cols-2 gap-2 w-full text-center text-xs">
              <div className="bg-slate-900/50 rounded-lg p-2">
                <div className="text-green-400 font-bold">{audit.verified_controls.length}</div>
                <div className="text-slate-500">Verified</div>
              </div>
              <div className="bg-slate-900/50 rounded-lg p-2">
                <div className="text-red-400 font-bold">{audit.gaps.length}</div>
                <div className="text-slate-500">Gaps</div>
              </div>
            </div>
          </div>

          {/* Framework scores */}
          <div className="glass rounded-2xl p-5 col-span-3 fade-in">
            <div className="text-slate-400 text-xs font-medium mb-4 uppercase tracking-wide">Framework Coverage</div>
            <div className="grid grid-cols-2 gap-x-8 gap-y-1">
              {Object.entries(audit.framework_scores).map(([fw, data]) => (
                <FwBar key={fw} name={`${fw} (${data.verified}/${data.total_controls})`} score={data.score}/>
              ))}
            </div>
            <div className="mt-4 pt-4 border-t border-slate-800/50 flex gap-6 text-xs text-slate-500">
              <span>⏱ Time saved: <span className="text-blue-300 font-medium">2 weeks → {audit.gaps.length > 5 ? "4 min" : "2 min"}</span></span>
              <span>💰 Consulting replaced: <span className="text-green-400 font-medium">~$50,000</span></span>
              <span>🤖 Models used: <span className="text-purple-300 font-medium">gpt-4o-mini + gpt-4o</span></span>
            </div>
          </div>
        </div>

        {/* Framework filter */}
        <div className="flex gap-2 mb-4">
          {["ALL","FedRAMP","CMMC","NIST_800_53","SOC2"].map(fw => (
            <button key={fw} onClick={() => setFwFilter(fw)}
              className="text-xs px-3 py-1.5 rounded-lg font-medium transition"
              style={{
                background: fwFilter===fw ? "rgba(56,189,248,0.2)" : "rgba(255,255,255,0.04)",
                color: fwFilter===fw ? "#38BDF8" : "#94A3B8",
                border: fwFilter===fw ? "1px solid rgba(56,189,248,0.4)" : "1px solid rgba(255,255,255,0.08)",
              }}>
              {fw}
            </button>
          ))}
        </div>

        {/* Tabs */}
        <div className="flex gap-1 mb-4 glass rounded-xl p-1 w-fit">
          {[["gaps","Gaps","🔴"],["verified","Verified","✅"],["report","Executive Report","📄"]].map(([t,l,i]) => (
            <button key={t} onClick={() => setTab(t)}
              className="text-sm px-4 py-2 rounded-lg font-medium transition"
              style={{
                background: tab===t ? "rgba(56,189,248,0.15)" : "transparent",
                color: tab===t ? "#38BDF8" : "#64748B",
              }}>
              {i} {l} {t==="gaps" ? `(${filteredGaps.length})` : t==="verified" ? `(${filteredVerified.length})` : ""}
            </button>
          ))}
        </div>

        {/* Gaps tab */}
        {tab === "gaps" && (
          <div>
            {audit.high_risk_gaps.length > 0 && (
              <div className="bg-red-900/20 border border-red-800/30 rounded-xl p-3 mb-4 text-sm text-red-300 fade-in">
                ⚠ {audit.high_risk_gaps.length} HIGH RISK gaps require immediate remediation before FedRAMP/CMMC authorization.
              </div>
            )}
            {filteredGaps.length === 0
              ? <div className="text-slate-500 text-center py-12">No gaps for this framework. Excellent coverage!</div>
              : <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {filteredGaps.map(g => <GapCard key={g.id} gap={g} onFix={() => {}}/>)}
                </div>
            }
          </div>
        )}

        {/* Verified tab */}
        {tab === "verified" && (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {filteredVerified.map(v => (
              <div key={v.id} className="glass rounded-xl p-4 fade-in">
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-green-400 text-sm">{v.status === "VERIFIED" ? "✓" : "~"}</span>
                  <span className="text-slate-200 font-medium text-sm">{v.control}</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full ml-auto ${v.status==="VERIFIED" ? "good-badge text-green-300" : "partial-badge text-yellow-300"}`}>
                    {v.status}
                  </span>
                </div>
                <div className="text-xs text-slate-500">{v.category} · {v.id}</div>
                {v.ai_note && <p className="text-xs text-slate-400 mt-1">{v.ai_note}</p>}
              </div>
            ))}
          </div>
        )}

        {/* Report tab */}
        {tab === "report" && (
          <div className="glass rounded-2xl p-6 fade-in">
            {report ? (
              <div>
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-slate-200 font-semibold">Executive Compliance Report</h3>
                  <button onClick={exportPDF}
                    className="text-xs px-3 py-1.5 rounded-lg"
                    style={{background:"rgba(5,150,105,0.2)",color:"#34D399",border:"1px solid rgba(5,150,105,0.3)"}}>
                    Download PDF
                  </button>
                </div>
                <div className="prose prose-invert max-w-none">
                  {report.split("\n\n").map((para, i) => (
                    <p key={i} className="text-slate-300 text-sm leading-relaxed mb-3">{para}</p>
                  ))}
                </div>
                <div className="mt-4 pt-4 border-t border-slate-800/50 text-xs text-slate-500 italic">
                  Generated by ProofLayer AI · This report is suitable for submission to your ISSO or federal compliance officer.
                </div>
              </div>
            ) : (
              <div className="text-center py-12">
                <div className="text-4xl mb-4">📄</div>
                <p className="text-slate-400 mb-4">Generate an executive compliance report to send to your ISSO or contracting officer.</p>
                <button onClick={generateReport}
                  className="px-6 py-2.5 rounded-xl text-sm font-semibold"
                  style={{background:"linear-gradient(135deg,#2563EB,#4F46E5)",color:"white"}}>
                  {loading ? "Generating..." : "Generate Executive Report"}
                </button>
              </div>
            )}
          </div>
        )}

        {/* Cost dashboard */}
        <CostDashboard key={tab}/>
      </div>
    </div>
  );

  return null;
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
